<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support Sessions — SkillsTrack</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <h1>Support sessions</h1>

        <div class="panel">
          <div class="panel-header">
            <h2>Your sessions with learners</h2>
            <div class="select-wrap">
              <select id="filter" aria-label="Filter sessions">
                <option value="upcoming">Upcoming</option>
                <option value="past">Past</option>
                <option value="all">All</option>
              </select>
            </div>
          </div>
          <div style="overflow-x:auto">
            <table>
              <thead>
                <tr>
                  <th>When</th>
                  <th>Learner</th>
                  <th>Topic</th>
                  <th>Booked by</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="session-rows"><tr><td colspan="5">Loading…</td></tr></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/shell.js"></script>
  <script type="module" src="js/support-sessions.js"></script>
</body>
</html>
