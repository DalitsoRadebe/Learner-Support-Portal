<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Facilitator Register — SkillsTrack</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-page">
    <form class="card" id="register-form" novalidate autocomplete="on">
      <h1>Facilitator Register</h1>
      <p class="helper-text">Create your facilitator account</p>

      <div class="field">
        <label for="name">Facilitator name</label>
        <input id="name" name="name" autocomplete="name" placeholder="Facilitator's name" required />
      </div>

      <div class="field">
        <label for="email">Facilitator Email</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="Facilitator email" required />
      </div>

      <div class="field">
        <label for="password">Create Password</label>
        <div class="password-input">
          <input id="password" name="password" type="password" autocomplete="new-password" placeholder="Facilitator Password" required minlength="6" />
          <button class="password-toggle" type="button" aria-label="Show password" aria-controls="password" aria-pressed="false" title="Show password" data-password-toggle>
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" />
              <circle cx="12" cy="12" r="3" />
              <path class="password-toggle__slash" d="m3 3 18 18" />
            </svg>
          </button>
        </div>
      </div>

      <div class="field">
        <label for="confirm">Re-enter password</label>
        <div class="password-input">
          <input id="confirm" name="confirm" type="password" autocomplete="new-password" placeholder="Facilitator password" required />
          <button class="password-toggle" type="button" aria-label="Show password" aria-controls="confirm" aria-pressed="false" title="Show password" data-password-toggle>
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" />
              <circle cx="12" cy="12" r="3" />
              <path class="password-toggle__slash" d="m3 3 18 18" />
            </svg>
          </button>
        </div>
        <div class="error-text" id="error" role="alert"></div>
      </div>

      <button class="btn btn-primary" type="submit" style="width:100%">Create account</button>

      <div class="form-footer">
        <a class="btn-link" href="login.html">Already have an account? Login</a>
        <a class="btn" href="register.html">Student</a>
      </div>
    </form>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/password-visibility.js"></script>
  <script type="module" src="js/register-facilitator.js"></script>
</body>
</html>
