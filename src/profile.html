<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — SkillsTrack</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <a class="back-link" id="back-link" href="#">&larr; Back</a>
        <div class="panel">
          <div class="profile-header">
            <div class="profile-avatar" id="profile-avatar"></div>
            <div>
              <h1 class="profile-name" id="profile-name"></h1>
              <p class="profile-email" id="profile-email"></p>
              <p class="muted" id="profile-role"></p>
            </div>
          </div>

          <!-- Profile picture controls: shown to learners only -->
          <div class="profile-actions" id="photo-actions" hidden>
            <input id="photo-input" type="file" accept="image/*" hidden />
            <button class="btn btn-primary" id="photo-btn" type="button">Change picture</button>
            <button class="btn" id="photo-remove-btn" type="button" hidden>Remove picture</button>
          </div>
          <div class="error-text" id="photo-error" role="alert"></div>

          <div class="profile-actions">
            <a class="btn" href="settings.html">Settings</a>
            <a class="btn" href="settings.html#password">Passwords</a>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
