
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support Booking — SkillsTrack</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <h1>Support Booking</h1>

        <div class="split">
          <form class="panel" id="booking-form" novalidate>
            <div class="panel-header"><h2>Book a support session</h2></div>

            <div class="field">
              <label for="topic">Topic</label>
              <select id="topic"></select>
            </div>

            <div class="field-row">
              <div class="field">
                <label for="date">Date</label>
                <input id="date" type="date" required />
              </div>
              <div class="field">
                <label for="time">Time</label>
                <input id="time" type="time" required />
              </div>
            </div>

            <div class="field">
              <label for="notes">What do you need help with? (optional)</label>
              <textarea id="notes" maxlength="500"></textarea>
              <div class="error-text" id="error" role="alert"></div>
            </div>

            <button class="btn btn-primary" type="submit" style="width:100%">BOOK SESSION</button>
          </form>

          <div class="panel">
            <div class="panel-header"><h2>My bookings</h2></div>
            <ul class="recent-list" id="booking-list"></ul>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/support-booking.js"></script>
</body>
</html>
