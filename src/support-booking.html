<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Support Booking — SkillsTrack</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>

<body>

  <div class="app">

    <aside
      class="sidebar"
      id="sidebar"
    ></aside>

    <div class="main">

      <header
        class="topbar"
        id="topbar"
      ></header>

      <main class="content">

        <h1>Support Booking</h1>

        <div class="panel">

          <h2>Book a Support Session</h2>

          <form id="support-form">

            <div class="field">

              <label for="topic">
                Topic
              </label>

              <input
                type="text"
                id="topic"
                placeholder="Enter the topic"
              >

              <div
                class="error-text"
                id="topic-error"
              ></div>

            </div>

            <div class="field">

              <label for="preferred-date">
                Preferred Date
              </label>

              <input
                type="date"
                id="preferred-date"
              >

              <div
                class="error-text"
                id="date-error"
              ></div>

            </div>

            <div class="field">

              <label for="notes">
                Notes
              </label>

              <textarea
                id="notes"
                rows="5"
                placeholder="Enter any additional notes"
              ></textarea>

            </div>

            <div class="form-footer">

              <a
                href="dashboard-learner.html"
                class="btn-link"
              >
                Cancel
              </a>

              <button
                type="submit"
                class="btn btn-primary"
              >
                Book Session
              </button>

            </div>

          </form>

          <div
            id="success-message"
            class="form-message"
            hidden
          ></div>

        </div>

      </main>

    </div>

  </div>

  <script
    type="module"
    src="js/support-booking.js"
  ></script>

</body>

</html>
