
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — SkillsTrack</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-page">
    <form class="card" id="login-form" novalidate>
      <h1>Login</h1>
      <p class="helper-text">Students and facilitators both sign in here</p>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="Student or Facilitator Email" required />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password" required />
        <div class="error-text" id="error" role="alert"></div>
      </div>

      <div class="form-footer">
        <button class="btn btn-primary" type="submit">Login</button>
        <a class="btn-link" href="forgot-password.html">Forgot password</a>
      </div>

      <div class="form-footer" style="margin-top:20px;justify-content:center">
        <a class="btn" href="register.html">Register</a>
      </div>
    </form>
  </div>

  <script src="js/storage.js"></script>
  <script type="module" src="js/login.js"></script>
</body>
</html>
