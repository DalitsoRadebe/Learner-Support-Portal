<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — SkillsTrack</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-page">
    <form class="card" id="forgot-form" novalidate>
      <h1>Forgot Password</h1>
      <p class="helper-text">Enter your student or facilitator email and we'll send you a link to reset your password</p>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="Student or Facilitator Email" required />
      </div>

      <button class="btn btn-primary" type="submit" style="width:100%">Send Reset Link</button>

      <div class="form-message" id="message" role="status" hidden></div>

      <div class="form-footer" style="justify-content:center;margin-top:20px">
        <a class="btn-link" href="login.html">Back to login</a>
        <a class="btn" href="register.html">Register</a>
      </div>
    </form>
  </div>

  <script src="js/storage.js"></script>
  <script type="module" src="js/forgot-password.js"></script>
</body>
</html>
