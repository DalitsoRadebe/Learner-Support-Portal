<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Forgot Password — SkillsTrack</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div class="auth-page">

    <form class="card" id="forgot-form" novalidate>

      <h1>Forgot Password</h1>

      <p class="helper-text">
        Enter your email and we'll send you instructions to reset your password.
      </p>

      <div class="field">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          placeholder="Enter your email"
          required
        >

      </div>

      <button
        class="btn btn-primary"
        type="submit"
        style="width:100%"
      >
        Send Reset Email
      </button>

      <div
        class="form-message success"
        id="message"
        hidden
      ></div>

      <div
        class="form-footer"
        style="justify-content:center;margin-top:20px"
      >

        <a class="btn" href="login.html">
          Back to Login
        </a>

      </div>

    </form>

  </div>

  <script type="module" src="js/forgot-password.js"></script>

</body>

</html>
