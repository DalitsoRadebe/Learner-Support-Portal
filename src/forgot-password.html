<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — SkillsTrack</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-page">
    <form class="card" id="forgot-form" novalidate>
      <h1>Forgot Password</h1>
      <p class="helper-text">Enter your student email and we'll send you instructions to reset your password</p>

      <div class="field">
        <label for="email">Student Email</label>
        <input id="email" type="email" placeholder="Student Email" required />
      </div>

      <button class="btn btn-primary" type="submit" style="width:100%">Send Reset Link</button>

      <div class="form-message success" id="message" hidden></div>

      <div class="form-footer" style="justify-content:center;margin-top:20px">
        <a class="btn" href="register.html">Register</a>
      </div>
    </form>
  </div>

  <script src="js/storage.js"></script>
  <script>
    document.getElementById('forgot-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const message = document.getElementById('message');
      message.hidden = false;
      message.textContent = email
        ? `If an account exists for ${email}, reset instructions have been sent.`
        : 'Please enter your email address.';
    });
  </script>
</body>
</html>
