<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assessor Dashboard — SkillsTrack</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <h1>Dashboard</h1>

        <div class="stat-grid">
          <div class="stat-card">
            <div class="label">Total Students</div>
            <div class="value" id="stat-total"></div>
          </div>
          <div class="stat-card">
            <div class="label">Outstanding Tasks</div>
            <div class="value" id="stat-outstanding"></div>
          </div>
          <div class="stat-card">
            <div class="label">Completed Tasks</div>
            <div class="value" id="stat-completed"></div>
          </div>
          <div class="stat-card">
            <div class="label">Average Progress</div>
            <div class="value" id="stat-average"></div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <h2>Student Overview</h2>
            <input class="search-input" id="search" type="search" placeholder="Search Students" aria-label="Search students" />
          </div>
          <div style="overflow-x:auto">
            <table>
              <thead>
                <tr>
                  <th>Student Name</th>
                  <th>Class</th>
                  <th>Completed Tasks</th>
                  <th>Progress</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="student-rows"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/dashboard-facilitator.js"></script>
</body>
</html>
