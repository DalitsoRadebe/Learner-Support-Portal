<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Task — SkillsTrack</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <a class="back-link" href="tasks.html">&larr; Back to my tasks</a>

        <div class="panel" style="max-width:560px;margin:0 auto">
          <div class="panel-header">
            <h1 style="margin:0">ADD NEW TASK</h1>
          </div>

          <form id="task-form" novalidate>
            <div class="field">
              <label for="title">Task Title</label>
              <input id="title" maxlength="120" required />
            </div>

            <div class="field-row">
              <div class="field">
                <label for="category">Category</label>
                <select id="category"></select>
              </div>
              <div class="field">
                <label for="date">Due date</label>
                <input id="date" type="date" required />
              </div>
            </div>

            <div class="field">
              <label for="instructions">Notes (optional)</label>
              <textarea id="instructions" maxlength="2000"></textarea>
            </div>

            <div class="field">
              <label for="share">Share with</label>
              <select id="share"></select>
              <div class="muted">A facilitator you share with can see the task and your work, and can mark it.</div>
            </div>

            <div class="field">
              <label for="file">Upload a file (optional)</label>
              <input id="file" type="file" />
              <div class="muted" id="file-hint"></div>
              <div class="error-text" id="error" role="alert"></div>
            </div>

            <div class="form-footer">
              <a class="btn-link" href="tasks.html">CANCEL</a>
              <button class="btn btn-primary" id="save-btn" type="submit">SAVE TASK</button>
            </div>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/shell.js"></script>
  <script type="module" src="js/task-form.js"></script>
</body>
</html>
