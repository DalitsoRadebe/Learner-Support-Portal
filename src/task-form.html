<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Task — SkillsTrack</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="panel" style="max-width:560px;margin:0 auto">
          <div class="panel-header">
            <h1 style="margin:0" id="form-title">ADD NEW TASK</h1>
            <button class="btn-link" id="delete-btn" type="button" style="color:var(--danger)" hidden>DELETE</button>
          </div>

          <form id="task-form" novalidate>
            <div class="field">
              <label for="title">Task Title</label>
              <input id="title" maxlength="120" required />
            </div>

            <div class="field">
              <label for="category">Category</label>
              <select id="category"></select>
            </div>

            <div class="field">
              <label for="date">Due date</label>
              <input id="date" type="date" required />
              <div class="error-text" id="error" role="alert"></div>
            </div>

            <div class="form-footer">
              <a class="btn-link" href="tasks.html">CANCEL</a>
              <button class="btn btn-primary" type="submit">SAVE TASK</button>
            </div>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/task-form.js"></script>
</body>
</html>
