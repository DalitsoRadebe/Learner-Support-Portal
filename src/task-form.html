<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Add Task - SkillsTrack</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>

<body>

  <div class="app">

    <aside
      class="sidebar"
      id="sidebar"
    ></aside>

    <div class="main">

      <header
        class="topbar"
        id="topbar"
      ></header>

      <main class="content">

        <div class="panel">

          <h1 id="form-title">
            ADD NEW TASK
          </h1>

          <form id="task-form">

            <div class="field">

              <label for="title">
                Task Title
              </label>

              <input
                type="text"
                id="title"
                placeholder="Enter task title"
              >

            </div>

            <div class="field">

              <label for="category">
                Category
              </label>

              <select id="category">

                <option value="">
                  Select Category
                </option>

                <option value="Javascript">
                  Javascript
                </option>

                <option value="Firebase">
                  Firebase
                </option>

                <option value="Documentation">
                  Documentation
                </option>

                <option value="HTML/CSS">
                  HTML/CSS
                </option>

                <option value="Other">
                  Other
                </option>

              </select>

            </div>

            <div class="field">

              <label for="date">
                Date
              </label>

              <input
                type="date"
                id="date"
              >

            </div>

            <div class="form-footer">

              <a
                class="btn-link"
                href="tasks.html"
              >
                CANCEL
              </a>

              <button
                class="btn btn-primary"
                type="submit"
              >
                SAVE TASK
              </button>

              <button
                class="btn"
                type="button"
                id="delete-btn"
              >
                DELETE
              </button>

            </div>

          </form>

        </div>

      </main>

    </div>

  </div>

  <script
    type="module"
    src="js/add-task.js"
  ></script>

</body>

</html>
